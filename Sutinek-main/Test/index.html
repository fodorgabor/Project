<!DOCTYPE html>
<html>
<body>

<h1>Steam Library</h1>
<div id="games"></div>

<script>
async function loadGames() {
    console.log("fetching...")
  const response = await fetch(
    "https://api.steampowered.com/ISteamApps/GetAppList/v2/"
  )

  const data = await response.json()
    console.log(data)
  const games = data.applist.apps.slice(0, 50)

  const container = document.getElementById("games")

  games.forEach(game => {
    const div = document.createElement("div")

    div.innerHTML = `
      <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/${game.appid}/header.jpg" width="200"/>
      <p>${game.name}</p>
    `

    container.appendChild(div)
  })
}

loadGames()
</script>

</body>
</html>
